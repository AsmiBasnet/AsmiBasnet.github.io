import duckdb

con = duckdb.connect(database=':memory:')

# Fast analytical query computing HbA1c uncontrolled patient risk segments
query = """
    SELECT 
        p.county,
        COUNT(DISTINCT p.patient_id) AS total_patients,
        AVG(TRY_CAST(obs.value AS DOUBLE)) AS avg_systolic_bp,
        COUNT(CASE WHEN obs.code = '4548-4' AND CAST(obs.value AS DOUBLE) >= 9.0 THEN 1 END) AS uncontrolled_diabetics,
        ROUND(COUNT(CASE WHEN obs.code = '4548-4' AND CAST(obs.value AS DOUBLE) >= 9.0 THEN 1 END) * 100.0 / 
              NULLIF(COUNT(DISTINCT p.patient_id), 0), 2) AS uncontrolled_pct
    FROM 'synthea_patients.parquet' p
    LEFT JOIN 'synthea_observations.parquet' obs 
      ON p.patient_id = obs.patient_id
    WHERE obs.date >= CURRENT_DATE - INTERVAL 365 DAY
    GROUP BY p.county
    HAVING total_patients >= 50
    ORDER BY uncontrolled_pct DESC;
"""
